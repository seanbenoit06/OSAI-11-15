<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Shield - Settings</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #E53935;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #757575;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .setting-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #E53935;
        }
        .help-text {
            font-size: 12px;
            color: #757575;
            margin-top: 4px;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .save-btn {
            background: #E53935;
            color: white;
            flex: 1;
        }
        .save-btn:hover {
            background: #c62828;
        }
        .save-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .reset-btn {
            background: #f5f5f5;
            color: #333;
        }
        .reset-btn:hover {
            background: #e0e0e0;
        }
        .status-message {
            padding: 12px;
            border-radius: 4px;
            margin-top: 16px;
            font-size: 14px;
            display: none;
        }
        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        .status-message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Contract Shield Settings</h1>
        <p class="subtitle">Configure the Reddit Review API endpoint</p>
        
        <div class="setting-group">
            <label for="redditApiUrl">Reddit API URL</label>
            <input 
                type="text" 
                id="redditApiUrl" 
                placeholder="http://localhost:8000"
                value="http://localhost:8000"
            >
            <p class="help-text">
                Enter the URL where your Reddit search API is running. Default is http://localhost:8000 for local development.
            </p>
        </div>

        <div class="button-group">
            <button class="save-btn" id="saveBtn">Save Settings</button>
            <button class="reset-btn" id="resetBtn">Reset to Default</button>
        </div>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <script src="options.js"></script>
</body>
</html>
