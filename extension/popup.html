<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Analyzer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 7V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V7L12 2Z" stroke="#E53935" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 8V12" stroke="#E53935" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="12" cy="16" r="0.5" fill="#E53935" stroke="#E53935"/>
                </svg>
                <h1>Contract Shield</h1>
            </div>
        </div>

        <!-- Status Section -->
        <div class="status-section">
            <div class="status-icon">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="24" cy="24" r="22" stroke="#E0E0E0" stroke-width="2"/>
                    <path d="M24 14V24L30 30" stroke="#757575" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <p class="status-text">Ready to analyze</p>
            <p class="instruction-text">Highlight text on the page, then click analyze</p>
        </div>

        <!-- Action Button -->
        <button class="analyze-btn" id="analyzeBtn">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 2L2.5 6V10C2.5 14.5 5.5 18.5 10 19.5C14.5 18.5 17.5 14.5 17.5 10V6L10 2Z" fill="white"/>
                <path d="M8 10L9.5 11.5L12.5 8.5" stroke="#E53935" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Analyze Content
        </button>

        <!-- Results Section (hidden by default) -->
        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="results-header">
                <h2>Analysis Complete</h2>
                <div class="sus-score" id="susScore">Sus Score: --%</div>
                <span class="close-results" id="closeResults">×</span>
            </div>
            <div class="red-flags-count">
                <span class="count" id="flagCount">0</span>
                <span class="label">Red Flags Found</span>
            </div>
            <div class="filter-bar">
                <div class="severity-group" id="severityGroup">
                    <span>Severity</span>
                    <label><input type="checkbox" value="5"> 5</label>
                    <label><input type="checkbox" value="4"> 4</label>
                    <label><input type="checkbox" value="3"> 3</label>
                    <label><input type="checkbox" value="2"> 2</label>
                    <label><input type="checkbox" value="1"> 1</label>
                </div>
                <div class="sort-group">
                    <label for="sortSelect">Sort by</label>
                    <select id="sortSelect">
                        <option value="severity-desc">Severity ↓</option>
                        <option value="severity-asc">Severity ↑</option>
                        <option value="category-asc">Category A→Z</option>
                    </select>
                </div>
            </div>
            <div class="preview-card" id="previewCard" style="display: none;">
                <div class="preview-header">
                    <span class="preview-badge">Top Issue</span>
                    <span class="preview-severity" id="previewSeverity"></span>
                </div>
                <p class="preview-category" id="previewCategory"></p>
                <p class="preview-example" id="previewExample"></p>
                <p class="preview-reason" id="previewReason"></p>
            </div>
            <div class="results-list" id="resultsList">
            </div>
        </div>

        <!-- Reddit Reviews Section -->
        <div class="reddit-section" id="redditSection" style="display: none;">
            <div class="reddit-header">
                <h3>🏢 Company Background</h3>
                <div class="company-name" id="companyName"></div>
            </div>

            <div class="reddit-sentiment" id="redditSentiment"></div>

            <div class="reddit-summary" id="redditSummary"></div>

            <div class="reddit-details">
                <details>
                    <summary id="redFlagsToggle">Red Flags from Tenants</summary>
                    <ul class="reddit-list" id="redFlagsList"></ul>
                </details>

                <details>
                    <summary id="positiveNotesToggle">Positive Experiences</summary>
                    <ul class="reddit-list" id="positiveNotesList"></ul>
                </details>

                <details>
                    <summary>Sample Tenant Experiences</summary>
                    <ul class="reddit-list" id="sampleExperiencesList"></ul>
                </details>
            </div>

            <div class="reddit-sources" id="redditSources"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>Version 1.0</span>
        </div>
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
